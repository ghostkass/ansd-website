# docker-compose.yml
version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ansd_postgres_db
    environment:
      POSTGRES_DB: ansd_db
      POSTGRES_USER: ansduser
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

volumes:
  db_data: